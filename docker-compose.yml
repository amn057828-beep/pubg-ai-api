services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pubg_ai
    ports:
      - "5432:5432"
    volumes:
      - pubg_ai_data:/var/lib/postgresql/data

  api:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  bot:
    build: ./backend
    env_file: .env
    command: python -m app.bot.main
    depends_on:
      - api
      - db

  dashboard:
    build: ./dashboard
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pubg_ai_data:
